# Fails a pull request whose description does not show the change working.
name: PR evidence
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-evidence-check.yml
