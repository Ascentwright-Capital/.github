# Reusable CI for a Node repository. A repo calls it from its own workflow:
#
#   jobs:
#     ci:
#       uses: Ascentwright-Capital/.github/.github/workflows/node-ci.yml@main
#       with:
#         scripts: typecheck lint test build
#
name: Node CI
on:
  workflow_call:
    inputs:
      scripts:
        description: Package scripts to run in order, space separated
        type: string
        default: test
      playwright:
        description: Install Playwright's Chromium before the scripts run
        type: boolean
        default: false
      working-directory:
        type: string
        default: .
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Detect the package manager and Node version
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"; else echo "name=npm" >> "$GITHUB_OUTPUT"; fi
          if [ -f .nvmrc ]; then echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"; else echo "node=22" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pm.outputs.node }}
          cache: ${{ steps.pm.outputs.name }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.name == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install
        run: |
          if [ "${{ steps.pm.outputs.name }}" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - if: inputs.playwright
        run: npx playwright install --with-deps chromium
      - name: Run ${{ inputs.scripts }}
        run: |
          for s in ${{ inputs.scripts }}; do
            echo "::group::$s"
            if [ "${{ steps.pm.outputs.name }}" = pnpm ]; then pnpm run "$s"; else npm run "$s"; fi
            echo "::endgroup::"
          done
