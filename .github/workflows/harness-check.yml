# Fails when a repository does not mount agent-harness as a submodule at .agents/shared.
# Dependabot keeps the pin current; this only checks that the mount exists and resolves.
name: Harness check
on:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check the agent-harness submodule
        run: |
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | grep -q ' \.agents/shared$' \
            || { echo "::error::Mount agent-harness at .agents/shared: git submodule add https://github.com/Ascentwright-Capital/agent-harness .agents/shared"; exit 1; }
          test -f .agents/shared/standards.md \
            || { echo "::error::.agents/shared is empty or not agent-harness"; exit 1; }
