# Fails a pull request whose title, description or commits credit an AI.
name: AI credit
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions: {}
concurrency:
  group: ai-credit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ai-credit-check.yml
