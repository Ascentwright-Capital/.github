name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: Ascentwright-Capital/.github/.github/workflows/node-ci.yml@main
    with:
      scripts: typecheck lint test build
  harness:
    uses: Ascentwright-Capital/.github/.github/workflows/harness-check.yml@main
